<svg
    width="16"
    height="12"
    viewBox="0 0 16 12"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
>
     <!-- Mushroom 1 (Left, Small) -->
     <g transform="translate(1, 4) scale(0.6)">
        <path d="M1 6 Q3.5 1 6 6 Z" fill="#FF00FF" />
        <rect x="2.8" y="6" width="1.4" height="4" rx="0.7" fill="#f5e6c8" />
     </g>

     <!-- Mushroom 2 (Center, Big) -->
     <g transform="translate(5, 1) scale(0.9)">
        <path d="M1 6 Q3.5 1 6 6 Z" fill="#FF00FF" />
        <rect x="2.8" y="6" width="1.4" height="4" rx="0.7" fill="#f5e6c8" />
        <circle cx="3" cy="4" r="0.5" fill="#ffffff" />
     </g>

     <!-- Mushroom 3 (Right, Medium) -->
     <g transform="translate(10, 3) scale(0.7)">
        <path d="M1 6 Q3.5 1 6 6 Z" fill="#FF00FF" />
        <rect x="2.8" y="6" width="1.4" height="4" rx="0.7" fill="#f5e6c8" />
     </g>

     <!-- Ground shadow -->
    <ellipse
        cx="8"
        cy="11"
        rx="6"
        ry="0.8"
        fill="#000000"
        opacity="0.1"
    />
</svg>
