<svg
    width="12"
    height="12"
    viewBox="0 0 12 12"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
>
    <!-- Apple body (Purple to indicate poison) -->
    <circle cx="6" cy="7" r="4.5" fill="#8e44ad" />
    
    <!-- Green slime/ooze on top -->
    <path d="M3 4 Q4.5 6 6 4 Q7.5 6 9 4" stroke="#2ecc71" stroke-width="1" fill="none" opacity="0.8"/>

    <!-- Stem -->
    <path d="M6 2.5 Q6 1 7 0.5" stroke="#5d4037" stroke-width="1" fill="none" />
    
    <!-- Leaf (Withered) -->
    <path d="M6 2.5 Q4 1 4 2.5 Q6 4 6 2.5" fill="#556b2f" />
    
     <!-- Ground shadow -->
    <ellipse
        cx="6"
        cy="11"
        rx="3"
        ry="0.8"
        fill="#000000"
        opacity="0.1"
    />
</svg>
